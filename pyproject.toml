[project]
name = "name-that-llm"
version = "0.1.0"
description = "Research workspace for the Kaggle Name That LLM competition"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13",
]

[dependency-groups]
explore = [
    "ipykernel>=6",
    "matplotlib>=3.8",
]
lora = [
    "torch>=2.6,<3",
    "transformers>=4.57,<6",
    "peft==0.20.0",
    "accelerate>=1,<2",
    "safetensors>=0.5,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntllm"]
